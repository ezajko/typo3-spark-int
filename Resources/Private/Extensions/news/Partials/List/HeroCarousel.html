<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers" data-namespace-typo3-fluid="true">

<div id="heroCarousel-{contentObjectData.uid}" class="carousel slide hero-carousel" data-bs-ride="carousel">
    <div class="carousel-inner">
        <f:for each="{newsItems}" as="newsItem" iteration="iterator">
            <div class="carousel-item {f:if(condition: iterator.isFirst, then: 'active')}">
                <f:if condition="{newsItem.mediaPreviews}">
                    <f:then>
                        <f:media file="{newsItem.mediaPreviews.0.originalResource}" class="d-block w-100 hero-image"
                            alt="{newsItem.mediaPreviews.0.originalResource.alternative}" />
                    </f:then>
                    <f:else>
                        <img src="https://placehold.co/1920x800/222/FFF?text=ETF+Spark" class="d-block w-100 hero-image"
                            alt="Placeholder">
                    </f:else>
                </f:if>
                <div class="carousel-caption d-none d-md-block text-start">
                    <div class="container">
                        <h1 class="display-3 fw-bold text-shadow">{newsItem.title}</h1>
                        <f:if condition="{newsItem.teaser}">
                            <div class="lead text-shadow">
                                <f:format.html>{newsItem.teaser}</f:format.html>
                            </div>
                        </f:if>
                        <n:link newsItem="{newsItem}" settings="{settings}" class="btn btn-primary btn-lg mt-3"
                            title="{newsItem.title}">
                            <f:translate key="more-link" />
                        </n:link>
                    </div>
                </div>
                <div class="hero-overlay"></div>
            </div>
        </f:for>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel-{contentObjectData.uid}"
        data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel-{contentObjectData.uid}"
        data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>
</div>

<style>
    .hero-carousel {
        position: relative;
    }

    .hero-carousel .hero-image {
        height: 600px;
        object-fit: cover;
    }

    .hero-carousel .hero-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to bottom, rgba(0, 0, 0, 0.2) 0%, rgba(0, 0, 0, 0.6) 100%);
        z-index: 1;
    }

    .hero-carousel .carousel-caption {
        bottom: 20%;
        z-index: 2;
        left: 0;
        right: 0;
        text-align: left;
    }

    .hero-carousel .text-shadow {
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    /* Simple Animation */
    .carousel-item-next.carousel-item-start,
    .carousel-item-prev.carousel-item-end {
        transform: translateX(0);
        margin-left: 0;
        margin-right: 0;
    }
</style>

</html>
