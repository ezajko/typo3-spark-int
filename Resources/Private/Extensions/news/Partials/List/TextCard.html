<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers" data-namespace-typo3-fluid="true">
<!--
	=====================
		Partials/List/TextCard.html
	=====================
-->
<div class="col">
    <div class="card h-100 border shadow-sm transition-hover">
        <div class="card-body d-flex flex-column">
            <!-- Date -->
            <div class="card-subtitle mb-2 text-primary fw-bold small text-uppercase ls-1">
                <f:format.date format="{f:translate(key:'dateFormat')}">{newsItem.datetime}</f:format.date>
            </div>

            <!-- Title -->
            <h5 class="card-title mb-3">
                <n:link newsItem="{newsItem}" settings="{settings}" title="{newsItem.title}"
                    class="text-decoration-none text-dark stretched-link">
                    {newsItem.title}
                </n:link>
            </h5>

            <!-- Teaser -->
            <div class="card-text small text-muted text-truncate-3 mb-3 flex-grow-1">
                <n:removeMediaTags>
                    <f:if condition="{newsItem.teaser}">
                        <f:then>
                            <f:format.crop maxCharacters="{settings.cropMaxCharacters}" respectWordBoundaries="1">
                                {newsItem.teaser}</f:format.crop>
                        </f:then>
                        <f:else>
                            <f:format.crop maxCharacters="{settings.cropMaxCharacters}" respectWordBoundaries="1">
                                {newsItem.bodytext}</f:format.crop>
                        </f:else>
                    </f:if>
                </n:removeMediaTags>
            </div>

            <!-- Arrow or read more indication if needed, stretched link handles click -->
            <div class="mt-auto text-end">
                <i class="bi bi-arrow-right text-primary"></i>
            </div>
        </div>
    </div>
</div>

</html>
